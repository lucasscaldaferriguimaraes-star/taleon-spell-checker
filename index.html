<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tibia Spell Sound Checklist</title>
<style>
:root{--bg:#0c1017;--panel:#141b25;--panel2:#1b2430;--text:#edf2f7;--muted:#9eabb9;--accent:#5ee1a5;--danger:#ff6b6b;--gold:#f3c969;--line:#293442}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#18212d,#0c1017 55%);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,Roboto,Arial}
header{padding:24px 28px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(12,16,23,.94);backdrop-filter:blur(10px);z-index:10}
h1{margin:0 0 5px;font-size:25px}.sub{color:var(--muted)}.wrap{max-width:1450px;margin:auto;padding:20px}
.controls{display:grid;grid-template-columns:1.8fr repeat(4,1fr);gap:10px;margin:16px 0}
input,select,button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:11px 12px}
button{cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.stat{background:var(--panel);padding:10px 14px;border:1px solid var(--line);border-radius:10px}.stat b{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.card{background:linear-gradient(145deg,var(--panel),#101721);border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;gap:12px;align-items:flex-start}
.card.done{opacity:.58;border-color:#2f755c}.card.missing{border-color:#8a5d5d;background:linear-gradient(145deg,#241719,#101318)}.card.nosound{border-color:#b65c5c}.card.ok{border-color:#2f9d72}.check{width:21px;height:21px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}
.name{font-weight:700;font-size:15px}.words{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--gold);margin:5px 0}.meta{color:var(--muted);font-size:12px;line-height:1.5}
.badge{display:inline-block;padding:2px 7px;border-radius:99px;background:var(--panel2);margin-right:5px}.wheel{color:#cda8ff}.training{color:#8ac9ff}
.actions{display:flex;gap:8px;margin:10px 0}.danger{color:#ff9b9b}.empty{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}}
</style>
</head>
<body>
<header><div class="wrap" style="padding:0">
<h1>🧙 Tibia — Checklist de Magias & Runas</h1>
<div class="sub">Use para testar se cada magia/runa está reproduzindo o som corretamente. O progresso fica salvo neste navegador.</div>
</div></header>
<main class="wrap">
<div class="tabs">
<button class="tab active" data-mode="spells">Magias</button>
<button class="tab" data-mode="runes">Runas</button>
<button class="tab" data-mode="wheel">Wheel of Destiny</button>
<button class="tab" data-mode="missing">❌ Não existe no Taleon</button>
</div>
<div class="controls">
<input id="search" placeholder="🔎 Buscar por nome ou palavras mágicas...">
<select id="voc"><option value="">Todas as vocações</option><option>Knight</option><option>Paladin</option><option>Druid</option><option>Sorcerer</option><option>Monk</option></select>
<select id="cat"><option value="">Todas as categorias</option><option>Ataque</option><option>Cura</option><option>Suporte</option><option>Stance</option><option>Party</option><option>Summon</option><option>Suprimento</option></select>
<select id="status">
<option value="">Todos</option>
<option value="todo">Não testadas</option>
<option value="done">Testadas ✓</option>
<option value="missing">❌ Não existe no Taleon</option>
<option value="nosound">🔴 Sem som</option>
<option value="ok">🟢 Som OK</option>
</select>
<select id="level"><option value="">Ordenar: level</option><option value="name">Nome</option><option value="level">Level</option><option value="vocation">Vocação</option></select>
</div>
<div class="actions">
<button id="markVisible">✓ Marcar visíveis como testadas</button>
<button id="clearVisible">↺ Desmarcar visíveis</button>
<button id="markMissing">❌ Marcar visíveis: não existe no Taleon</button>
<button id="reset" class="danger">Apagar todo o progresso</button>
</div>
<div class="stats"><div class="stat">Exibidas: <b id="shown">0</b></div><div class="stat">Testadas: <b id="done">0</b></div><div class="stat">Progresso: <b id="pct">0%</b></div></div>
<div id="grid" class="grid"></div>
<div id="empty" class="empty" style="display:none">Nenhum item encontrado.</div>
</main>

 if(mode==="wheel") return DATA.wheel.map((x,i)=>({id:"w"+i,name:x[0],level:x[1],voc:x[2],words:x[3],cat:x[4],type:"wheel"}));
 return [...DATA.spells.map((x,i)=>({id:"s"+i,name:x[0],level:x[1],voc:x[2],words:x[3],cat:x[4],type:x[5]})),
         ...DATA.runes.map((x,i)=>({id:"r"+i,name:x[0],level:x[1],voc:x[2],words:x[3],cat:"Runa",type:"rune"})),
         ...DATA.wheel.map((x,i)=>({id:"w"+i,name:x[0],level:x[1],voc:x[2],words:x[3],cat:x[4],type:"wheel"}))]
         .filter(x=>states[x.id]==="missing");
}
function vocMatch(v,filter){return !filter||v.split("/").includes(filter)}
function render(){
 let a=allItems(), q=el("search").value.toLowerCase().trim(), v=el("voc").value, c=el("cat").value, s=el("status").value;
 a=a.filter(x=>(!q||(x.name+" "+x.words+" "+x.voc).toLowerCase().includes(q))&&vocMatch(x.voc,v)&&(!c||x.cat===c)&&
   (!s||(s==="done"?states[x.id]==="tested":s==="missing"?states[x.id]==="missing":s==="ok"?states[x.id]==="ok":s==="nosound"?states[x.id]==="nosound":!states[x.id])));
 let ord=el("level").value;
 a.sort((x,y)=>ord==="name"?x.name.localeCompare(y.name):ord==="vocation"?x.voc.localeCompare(y.voc):x.level-y.level||x.name.localeCompare(y.name));
 el("grid").innerHTML=a.map(x=>{
   const st=states[x.id]||"";
   const cls=st==="missing"?"missing":st==="nosound"?"nosound":st==="ok"?"ok":st==="tested"?"done":"";
   const label=st==="missing"?"❌ Não existe no Taleon":st==="nosound"?"🔴 Sem som":st==="ok"?"🟢 Som OK":st==="tested"?"✓ Testada":"Não testada";
   return `<div class="card ${cls}">
    <input class="check" type="checkbox" data-id="${x.id}" ${st==="tested"||st==="ok"?"checked":""}>
    <div style="flex:1"><div class="name">${x.name}</div><div class="words">${x.words}</div>
    <div class="meta"><span class="badge">Lv ${x.level}</span><span class="badge">${x.voc.replaceAll("/",", ")}</span><span class="badge">${x.type==="wheel"?"WHEEL":x.type==="training"?"TREINO":x.type==="rune"?"RUNA":x.cat}</span>
    <span class="badge">${label}</span></div>
    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
      <button class="stateBtn" data-id="${x.id}" data-state="ok">🟢 Som OK</button>
      <button class="stateBtn" data-id="${x.id}" data-state="nosound">🔴 Sem som</button>
      <button class="stateBtn" data-id="${x.id}" data-state="missing">❌ Não existe</button>
      <button class="stateBtn" data-id="${x.id}" data-state="">⚪ Limpar</button>
    </div></div></div>`;
 }).join("");
 document.querySelectorAll(".check").forEach(cb=>cb.addEventListener("change",e=>{states[e.target.dataset.id]=e.target.checked?"tested":"";save();render()}));
 document.querySelectorAll(".stateBtn").forEach(b=>b.addEventListener("click",e=>{states[e.currentTarget.dataset.id]=e.currentTarget.dataset.state;save();render()}));
 let all=DATA.spells.map((x,i)=>"s"+i).concat(DATA.runes.map((x,i)=>"r"+i),DATA.wheel.map((x,i)=>"w"+i));
 let done=all.filter(id=>states[id]&&states[id]!=="missing").length;
 el("shown").textContent=a.length;el("done").textContent=done;el("pct").textContent=Math.round(done/Math.max(all.length,1)*100)+"%";
 el("empty").style.display=a.length?"none":"block";
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");mode=b.dataset.mode;render()});
["search","voc","cat","status","level"].forEach(id=>el(id).oninput=render);
el("markVisible").onclick=()=>{document.querySelectorAll(".check").forEach(x=>states[x.dataset.id]="tested");save();render()};
el("clearVisible").onclick=()=>{document.querySelectorAll(".check").forEach(x=>states[x.dataset.id]="");save();render()};
el("markMissing").onclick=()=>{document.querySelectorAll(".check").forEach(x=>states[x.dataset.id]="missing");save();render()};
el("reset").onclick=()=>{if(confirm("Apagar todas as marcações?")){states={};save();render()}};
render();
</script>
</body></html>
